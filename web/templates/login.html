<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a2540; --sage: #4a7c59; --bg: #f7f4ef;
  --border: #ddd8cf; --text: #1a2540; --text-sec: #5a6680;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans:  'DM Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans); background: var(--bg);
  min-height: 100vh; display: grid; place-items: center;
  background-image: radial-gradient(circle at 20% 80%, rgba(74,124,89,0.06) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(26,37,64,0.05) 0%, transparent 50%);
}
.login-card {
  width: 400px; background: #fff; border-radius: 16px;
  border: 1px solid var(--border); padding: 44px 40px;
  box-shadow: 0 20px 60px rgba(26,37,64,0.1);
}
.logo-area { text-align: center; margin-bottom: 32px; }
.logo-circle {
  width: 64px; height: 64px; border-radius: 16px;
  background: linear-gradient(135deg, var(--navy), #2c3e6b);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px;
}
.title {
  font-family: var(--font-serif); font-size: 26px; font-weight: 700;
  color: var(--navy); margin-bottom: 4px;
}
.subtitle { font-size: 13px; color: var(--text-sec); }
.flash-error {
  background: rgba(176,48,48,0.08); border: 1px solid rgba(176,48,48,0.2);
  color: #b03030; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; margin-bottom: 20px;
}
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-sec); margin-bottom: 6px; letter-spacing: 0.3px;
}
.field input {
  width: 100%; padding: 11px 14px; border-radius: 8px;
  border: 1px solid var(--border); font-family: var(--font-sans);
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: var(--bg);
}
.field input:focus {
  border-color: var(--navy); background: #fff;
  box-shadow: 0 0 0 3px rgba(26,37,64,0.08);
}
.submit-btn {
  width: 100%; padding: 12px; background: var(--navy); color: #fff;
  border: none; border-radius: 8px; font-family: var(--font-sans);
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  margin-top: 8px;
}
.submit-btn:hover { background: #2c3e6b; transform: translateY(-1px); }
.footer-note {
  text-align: center; margin-top: 24px;
  font-size: 11px; color: var(--text-sec);
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-circle">🎓</div>
    <div class="title">SmartAttend</div>
    <div class="subtitle">Face Recognition Attendance System</div>
  </div>

  {% with messages = get_flashed_messages(category_filter=['error']) %}
    {% if messages %}
      {% for msg in messages %}
        <div class="flash-error">⚠ {{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="/login">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="submit-btn">Sign In →</button>
  </form>

  <div class="footer-note">
    B.Tech Final Year Project · VMOU Uttarakhand Technical University
  </div>
</div>
</body>
</html>
